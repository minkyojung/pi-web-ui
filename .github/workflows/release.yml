# A tag v<version> becomes a GitHub Release with the signed, notarized disk
# image on it, and the zip and latest-mac.yml the installed apps update from.
#
# The tag is made by scripts/release.mjs, which has already closed the
# changelog and bumped package.json; the two checks at the top repeat what it
# checked, because a tag pushed by hand is the one that skips them. Nothing
# ships from a machine: the certificate comes out of the secrets as a base64
# .p12 that electron-builder imports into a keychain of its own for the run.
#
# Secrets: CSC_LINK (the .p12, base64), CSC_KEY_PASSWORD, APPLE_ID,
# APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID. GITHUB_TOKEN is provided.
#
# Run by hand from the Actions tab it is a rehearsal: everything a tag does —
# the certificate, the signing, the notarization, the checks on the result —
# and nothing published. The first tag found out on the day what a rehearsal
# would have found out before it.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  release:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci

      - name: The tag is the version in package.json
        if: github.ref_type == 'tag'
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME#v}" != "$VERSION" ]; then
            echo "::error::tag $GITHUB_REF_NAME but package.json says $VERSION — cut releases with scripts/release.mjs" >&2
            exit 1
          fi

      - name: CHANGELOG.md has this version's section
        if: github.ref_type == 'tag'
        run: |
          node --input-type=module -e '
            import { readFileSync, writeFileSync } from "node:fs";
            import { sectionFor } from "./scripts/release.mjs";
            const v = process.env.GITHUB_REF_NAME.slice(1);
            const notes = sectionFor(readFileSync("CHANGELOG.md", "utf8"), v);
            if (!notes) { console.error(`::error::CHANGELOG.md has no [${v}] section`); process.exit(1); }
            writeFileSync("release-notes.md", notes + "\n");
          '

      - run: npm run typecheck
      - run: npm test

      # The certificate goes into a keychain made here, the way GitHub's own
      # guide for macOS runners does it, and electron-builder is pointed at that
      # keychain rather than handed the .p12. Handed the .p12 it makes a keychain
      # of its own and then unlocks it with the certificate's password instead
      # of the keychain's (app-builder-lib 26.15, macCodeSign.js importCerts),
      # which the runner refuses: "The user name or passphrase you entered is
      # not correct", and no release. Done by hand, a wrong certificate password
      # also fails where it is wrong — at the import — and says so.
      - name: The certificate, in a keychain of this run's own
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          printf '%s' "$CSC_LINK" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/certificate.p12" -P "$CSC_KEY_PASSWORD" -f pkcs12 -k "$KEYCHAIN" -T /usr/bin/codesign -T /usr/bin/productbuild
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          # One valid identity, or the build below has nothing to sign with.
          security find-identity -v -p codesigning "$KEYCHAIN" | sed -E 's/[0-9A-F]{40}/<hash>/'
          security find-identity -v -p codesigning "$KEYCHAIN" | grep -q "Developer ID Application"
          echo "CSC_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      # The release is made here, with its notes — the changelog section, which
      # the updater shows — before anything is uploaded to it. Left to
      # electron-builder it was made twice: the zip and the disk image are
      # published side by side, each found no release for the tag and each made
      # one, so 0.0.1 came out as two releases with the zip alone in the second,
      # where no updater would have looked, and the step that attached the notes
      # afterwards was refused (422) because the tag named two releases.
      #
      # A draft, until the last step: an installed app asks GitHub for the
      # latest release and reads latest-mac.yml off it, and for the minutes
      # between this step and the uploads 0.0.2 was the latest release with
      # nothing on it — "Cannot find latest-mac.yml", to a person who had just
      # pressed Check for Updates. A draft is not the latest release to anyone.
      - name: The release, made once, as a draft
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "Octave ${GITHUB_REF_NAME#v}" --notes-file release-notes.md

      # A tag publishes; a run by hand builds, signs and notarizes the same way
      # and publishes nothing.
      - name: Build, sign, notarize, publish
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build && npx electron-builder --mac --arm64 --publish ${{ github.ref_type == 'tag' && 'always' || 'never' }}

      - name: Verify what was built
        run: scripts/verify-signed.sh release/mac-arm64/Octave.app

      # What a person downloads, what the updater downloads, and the file that
      # tells the updater which: all three on the one release, or this is red
      # and the draft stays a draft. Then, and only then, it is published —
      # which is the moment an installed app can first see it.
      - name: The release has everything on it, and is published
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V="${GITHUB_REF_NAME#v}"
          HAVE="$(gh release view "$GITHUB_REF_NAME" --json assets -q '.assets[].name')"
          for f in "latest-mac.yml" "Octave-$V-arm64-mac.zip" "Octave-$V-arm64.dmg"; do
            echo "$HAVE" | grep -qxF "$f" || { echo "::error::$f is not on the release" >&2; exit 1; }
          done
          [ "$(gh api "repos/$GITHUB_REPOSITORY/releases" -q "[.[] | select(.tag_name == \"$GITHUB_REF_NAME\")] | length")" = "1" ] || { echo "::error::more than one release for $GITHUB_REF_NAME" >&2; exit 1; }
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest

      - name: The keychain goes with the run
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true

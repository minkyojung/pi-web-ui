<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>pi</title>
<script>
/* Before the first paint, so the window is never drawn in the theme it is about
   to leave. The same resolution as web/src/theme.ts — inline because a module
   import would run after the page has been shown. */
try {
  var t = localStorage.getItem("theme");
  document.documentElement.dataset.theme =
    t === "dark" || (t !== "light" && matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
} catch (e) {
  document.documentElement.dataset.theme = "light";
}
</script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Octave</title>
<script>
/* Before the first paint, so the window is never drawn in the theme it is about
   to leave. The same resolution as web/src/theme.ts, read from where prefs.ts
   reads it — inline because a module import would run after the page has been
   shown. */
try {
  var t = window.pi && window.pi.prefs ? window.pi.prefs.get("theme") : localStorage.getItem("theme");
  document.documentElement.dataset.theme =
    t === "light" || t === "dark" || t === "octave-light" || t === "octave-dark"
      ? t
      : matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
} catch (e) {
  document.documentElement.dataset.theme = "light";
}
</script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>pi</title>
<style>
  :root { color-scheme: light dark; }
  body { font: 14px/1.5 system-ui, sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; }
  header { padding: 8px 12px; border-bottom: 1px solid #8884; display: flex; gap: 12px; align-items: center; }
  #settings { padding: 6px 12px; border-bottom: 1px solid #8884; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; font-size: 12px; }
  #settings .group { display: flex; gap: 6px; align-items: center; }
  #settings label { white-space: nowrap; }
  #model { max-width: 16em; }
  #sessions { max-width: 20em; }
  #stop:disabled { opacity: .4; }
  #note { color: #888; font-size: 11px; }
  #queued { color: #c60; font-size: 11px; }
  #usage { color: #888; margin-left: auto; font-variant-numeric: tabular-nums; }
  #usage .warn { color: #c60; }
  #text { flex: 1; font: inherit; padding: 6px 8px; }
  #status { color: #888; font-size: 12px; min-width: 5em; }

  main { flex: 1; overflow: auto; padding: 12px; }
  #raw { display: none; white-space: pre-wrap; font: 12px ui-monospace, monospace; }
  body.raw #chat { display: none; }
  body.raw #raw { display: block; }

  .item { margin-bottom: 12px; }
  .user { font-weight: 600; white-space: pre-wrap; }
  .user::before { content: "› "; color: #888; }
  .assistant { white-space: pre-wrap; }
  .tool { font: 12px ui-monospace, monospace; border-left: 2px solid #8884; padding-left: 8px; color: #888; }
  .tool .name { color: inherit; font-weight: 600; }
  .tool pre { margin: 4px 0 0; white-space: pre-wrap; max-height: 12em; overflow: auto; }
  .error { color: #c00; white-space: pre-wrap; }
  .done { color: #888; font-size: 12px; }
  .notice { color: #a60; font-size: 12px; }
</style>
</head>
<body>
  <header>
    <form id="form" style="display: contents;">
      <input id="text" placeholder="pi에게 보낼 말" autocomplete="off" autofocus>
      <select id="behavior" title="작업 중일 때 보낸 말을 어떻게 처리할지">
        <option value="followUp">기다렸다 보내기</option>
        <option value="steer">바로 끼어들기</option>
      </select>
      <button>send</button>
    </form>
    <label><input type="checkbox" id="rawToggle"> raw</label>
    <span id="status">connecting…</span>
  </header>
  <div id="settings">
    <span class="group">
      <select id="sessions"></select>
      <button id="newSession">새 대화</button>
    </span>
    <span class="group"><select id="model"></select></span>
    <span class="group">
      <label for="thinking">생각</label>
      <select id="thinking"></select>
    </span>
    <span class="group" id="tools"></span>
    <button id="stop" disabled>중단</button>
    <span class="group" id="usage" title=""></span>
    <span id="queued"></span>
    <span id="note"></span>
  </div>
  <main>
    <div id="chat"></div>
    <pre id="raw"></pre>
  </main>
  <script type="module" src="/client.js"></script>
</body>
</html>
